name: bench

on:
  workflow_dispatch:
    inputs:
      n_time:
        description: sentences per timing run
        default: "200"
      rounds:
        description: interleaved timing rounds
        default: "3"

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: ggml source (tetherto/qvac-fabric-llm.cpp at the commit used locally)
        run: |
          git init -q fabric
          git -C fabric fetch -q --depth 1 https://github.com/tetherto/qvac-fabric-llm.cpp 72f6dfa65c04401ea68d9414488e2af8d00545a9
          git -C fabric checkout -q FETCH_HEAD

      - name: deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libsentencepiece-dev pkg-config cmake

      - name: deps (macOS)
        if: runner.os == 'macOS'
        run: brew install sentencepiece abseil pkg-config

      - name: deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-sentencepiece mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip

      - name: model (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download model -p '*.bin' -D model

      - name: run (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python3 -m pip install -q --break-system-packages sacrebleu || python3 -m pip install -q sacrebleu
          ./run.sh "$PWD/fabric/ggml" "$PWD/model/ggml-indictrans2-en-indic-dist-200M-q4_0.bin" "results/${{ matrix.os }}" "${{ inputs.n_time || '200' }}" "${{ inputs.rounds || '3' }}"

      - name: run (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          python -m pip install -q --break-system-packages sacrebleu || python -m pip install -q sacrebleu
          ./run.sh "$PWD/fabric/ggml" "$PWD/model/ggml-indictrans2-en-indic-dist-200M-q4_0.bin" "results/${{ matrix.os }}" "${{ inputs.n_time || '200' }}" "${{ inputs.rounds || '3' }}"

      - name: job summary
        if: always()
        run: cat "results/${{ matrix.os }}/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results/${{ matrix.os }}
