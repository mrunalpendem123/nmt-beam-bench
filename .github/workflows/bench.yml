name: bench

on:
  workflow_dispatch:
    inputs:
      n_time:
        description: sentences per timing run
        default: "200"
      rounds:
        description: interleaved timing rounds
        default: "3"
      n_quality:
        description: sentences for the quality comparison (1012 = all)
        default: "1012"
      machines:
        description: JSON list of runner labels
        default: '["ubuntu-24.04","ubuntu-24.04-arm","macos-latest","windows-2022"]'
      reps:
        description: JSON list, one job per entry per machine
        default: '[1]'

permissions:
  contents: read

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.machines || '["ubuntu-24.04","ubuntu-24.04-arm","macos-latest","windows-2022"]') }}
        rep: ${{ fromJSON(inputs.reps || '[1]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: ggml source (tetherto/qvac-fabric-llm.cpp at the commit used locally)
        run: |
          git init -q fabric
          git -C fabric fetch -q --depth 1 https://github.com/tetherto/qvac-fabric-llm.cpp 72f6dfa65c04401ea68d9414488e2af8d00545a9
          git -C fabric checkout -q FETCH_HEAD

      - name: deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake

      - name: deps (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: deps (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja

      - name: native Python for scoring (Windows)
        if: runner.os == 'Windows'
        id: py
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sacrebleu (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install -q sacrebleu

      - name: model (release asset)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download model -p '*.bin' -D model

      - name: run (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          python3 -m pip install -q --break-system-packages sacrebleu || python3 -m pip install -q sacrebleu
          ./run.sh "$PWD/fabric/ggml" "$PWD/model/ggml-indictrans2-en-indic-dist-200M-q4_0.bin" "results/${{ matrix.os }}-${{ matrix.rep }}" "${{ inputs.n_time || '200' }}" "${{ inputs.rounds || '3' }}" "${{ inputs.n_quality || '1012' }}"

      - name: run (Windows, MSYS2 UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
          CMAKE_GENERATOR: Ninja
          PYTHONUTF8: "1"
        run: |
          export PYTHON="$(cygpath -u "$PYTHON")"
          ./run.sh "$PWD/fabric/ggml" "$PWD/model/ggml-indictrans2-en-indic-dist-200M-q4_0.bin" "results/${{ matrix.os }}-${{ matrix.rep }}" "${{ inputs.n_time || '200' }}" "${{ inputs.rounds || '3' }}" "${{ inputs.n_quality || '1012' }}"

      - name: job summary
        if: always()
        run: cat "results/${{ matrix.os }}-${{ matrix.rep }}/summary.md" >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}-${{ matrix.rep }}
          path: results/${{ matrix.os }}-${{ matrix.rep }}
